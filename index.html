<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Glowie's — Scripts</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060410;
  --surface:rgba(255,255,255,0.035);
  --surface-h:rgba(255,255,255,0.065);
  --border:rgba(255,255,255,0.07);
  --border-h:rgba(160,110,255,0.4);
  --text:#f0ebff;
  --muted:rgba(200,185,240,0.5);
  --accent:#b47eff;
  --accent2:#7ee8fa;
}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
nav,header,section,main,footer{position:relative;z-index:2}

/* NAV */
nav{
  position:sticky;top:0;z-index:100;
  height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 2.5rem;
  background:rgba(6,4,16,0.6);
  backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
}
.logo{
  font-family:'Space Mono',monospace;font-weight:700;font-size:.9rem;
  color:var(--accent);text-decoration:none;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;
}
.logo-gem{width:22px;height:22px;flex-shrink:0}
.nav-links{display:flex;gap:.2rem;align-items:center}
.nav-links a{
  font-size:.75rem;font-weight:500;color:var(--muted);
  text-decoration:none;padding:.3rem .8rem;border-radius:6px;
  border:1px solid transparent;transition:all .15s;letter-spacing:.02em;
}
.nav-links a:hover{color:var(--text);border-color:var(--border);background:rgba(255,255,255,.04)}
.sep{width:1px;height:16px;background:var(--border);margin:0 .2rem}

/* HERO */
.hero{
  max-width:980px;margin:0 auto;
  padding:5.5rem 2rem 3.5rem;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent2);margin-bottom:1.4rem;
}
.eyebrow-line{width:24px;height:1px;background:var(--accent2);opacity:.6}
h1{
  font-size:clamp(2.8rem,5.8vw,4.4rem);font-weight:700;
  line-height:1.04;letter-spacing:-.05em;margin-bottom:1.8rem;
}
.h1-grad{
  display:block;
  background:linear-gradient(110deg,#b47eff 0%,#7ee8fa 60%,#b47eff 100%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 5s linear infinite;
}
@keyframes shimmer{to{background-position:200% center}}

/* BADGES */
.badges{display:flex;flex-direction:row;gap:10px}
.badge{
  display:flex;align-items:center;gap:8px;
  padding:.55rem .85rem;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  font-size:.72rem;color:var(--muted);font-weight:500;transition:border-color .2s;
}
.badge:hover{border-color:rgba(180,126,255,.3)}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dg{background:#4ade80;box-shadow:0 0 5px #4ade80}
.dp{background:var(--accent);box-shadow:0 0 5px var(--accent)}
.dc{background:var(--accent2);box-shadow:0 0 5px var(--accent2)}

/* SECTION BAR */
.section-bar{
  max-width:980px;margin:0 auto 1.1rem;padding:0 2rem;
  display:flex;align-items:center;gap:12px;
}
.section-bar span{
  font-family:'Space Mono',monospace;font-size:.62rem;
  color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
}
.section-bar hr{flex:1;border:none;border-top:1px solid var(--border)}

/* GRID */
.grid{
  max-width:980px;margin:0 auto;
  padding:0 2rem 6rem;
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}

/* CARD */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .25s,transform .2s;
  position:relative;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:16px;
  background:radial-gradient(ellipse at 0% 0%,rgba(140,80,255,.07) 0%,transparent 60%);
  pointer-events:none;opacity:0;transition:opacity .3s;
}
.card:hover{border-color:var(--border-h);transform:translateY(-2px)}
.card:hover::before{opacity:1}
.card-body{padding:1.25rem 1.4rem 1.3rem;flex:1;display:flex;flex-direction:column}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:.55rem}
.card-name{
  font-family:'Space Mono',monospace;font-size:.82rem;font-weight:700;
  color:var(--text);letter-spacing:-.01em;
}
.tag{
  font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.14rem .5rem;border-radius:5px;flex-shrink:0;
}
.tag-uni{background:rgba(180,126,255,.1);border:1px solid rgba(180,126,255,.25);color:var(--accent)}
.tag-game{background:rgba(126,232,250,.08);border:1px solid rgba(126,232,250,.2);color:var(--accent2)}
.card-desc{font-size:.75rem;color:var(--muted);line-height:1.65;margin-bottom:.9rem}

/* CODE BOX */
.code-box{
  border-radius:10px;
  border:1px solid var(--border);
  overflow:hidden;
  background:rgba(0,0,0,.45);
  margin-top:auto;
}
.code-box-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.28rem .7rem;
  background:rgba(255,255,255,.025);
  border-bottom:1px solid var(--border);
}
.code-lbl{
  font-family:'Space Mono',monospace;font-size:.58rem;
  color:rgba(200,185,240,.3);letter-spacing:.08em;text-transform:uppercase;
}
.copy-btn{
  display:flex;align-items:center;gap:4px;
  font-family:'Space Mono',monospace;font-size:.6rem;color:var(--muted);
  padding:.18rem .6rem;border-radius:5px;border:1px solid var(--border);
  background:transparent;cursor:pointer;transition:all .15s;
}
.copy-btn:hover{color:var(--accent);border-color:rgba(180,126,255,.35);background:rgba(180,126,255,.06)}
.copy-btn.ok{color:var(--accent);border-color:rgba(180,126,255,.4);background:rgba(180,126,255,.08)}
.copy-btn svg{width:9px;height:9px}
.code-box pre{
  margin:0;padding:.7rem .9rem;
  font-family:'Space Mono',monospace;font-size:.62rem;line-height:1.55;
  background:transparent;
  color:rgba(180,126,255,.75);
  white-space:pre-wrap;word-break:break-all;
}

/* FOOTER */
footer{
  border-top:1px solid var(--border);
  padding:1.5rem 2.5rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;
  position:relative;z-index:2;
}
.footer-brand{font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;color:var(--accent)}
.footer-links{display:flex;gap:1.5rem}
.footer-links a{font-size:.72rem;color:var(--muted);text-decoration:none;transition:color .15s}
.footer-links a:hover{color:var(--accent)}
.footer-copy{font-size:.68rem;color:rgba(200,185,240,.3)}

/* CHANGELOG */
.cl-btn{
  margin-top:.7rem;
  font-family:'Space Mono',monospace;font-size:.6rem;color:var(--muted);
  background:transparent;border:1px solid var(--border);border-radius:6px;
  padding:.25rem .7rem;cursor:pointer;transition:all .15s;align-self:flex-start;
}
.cl-btn:hover{color:var(--accent);border-color:rgba(180,126,255,.35);background:rgba(180,126,255,.05)}
.cl-modal{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(6,4,16,.8);backdrop-filter:blur(10px);
  align-items:center;justify-content:center;
}
.cl-modal.open{display:flex}
.cl-box{
  background:#0d0a1e;border:1px solid var(--border-h);border-radius:16px;
  width:min(500px,92vw);max-height:72vh;overflow-y:auto;
  padding:1.5rem 1.6rem;
}
.cl-box-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:1.2rem;
}
.cl-box-title{font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;color:var(--accent)}
.cl-close{
  background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--muted);cursor:pointer;font-size:.9rem;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.cl-close:hover{color:var(--text);border-color:var(--border-h)}
.cl-entry{padding:.85rem 0;border-bottom:1px solid var(--border)}
.cl-entry:last-child{border-bottom:none}
.cl-entry-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.cl-ver{
  font-family:'Space Mono',monospace;font-size:.68rem;font-weight:700;
  color:var(--accent);background:rgba(180,126,255,.1);
  border:1px solid rgba(180,126,255,.2);border-radius:4px;
  padding:.1rem .45rem;
}
.cl-date{font-size:.65rem;color:var(--muted)}
.cl-entry p{font-size:.73rem;color:rgba(200,185,240,.65);line-height:1.65}

@media(max-width:680px){
  nav{padding:0 1rem}
  .hero{padding:3rem 1rem 2rem}
  .badges{flex-wrap:wrap;justify-content:center}
  .grid{grid-template-columns:1fr;padding-left:1rem;padding-right:1rem}
  .section-bar{padding-left:1rem;padding-right:1rem}
  h1{font-size:2.4rem}
  footer{padding:1.2rem 1rem}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- Embedded scripts.json for local file:// testing -->
<script id="embedded-scripts" type="application/json">
{
  "scripts": [
    {
      "id": "script-1",
      "name": "TTK",
      "tag": "game",
      "tagDisplay": "TTK",
      "description": "TTK script featuring player ESP.",
      "code": "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/yourname/repo/main/ttk.lua\"))()",
      "changelog": [
        {
          "version": "v1.0",
          "date": "June 12th 2026",
          "notes": "Initial release with ESP functionality."
        }
      ]
    }
  ]
}
</script>

<nav>
  <a class="logo" href="#">
    <svg class="logo-gem" viewBox="0 0 22 22" fill="none">
      <path d="M11 2L3 8l8 12 8-12z" stroke="#b47eff" stroke-width="1.2" fill="rgba(180,126,255,.12)"/>
      <path d="M3 8h16M11 2l4 6-4 12-4-12z" stroke="#b47eff" stroke-width=".8" stroke-opacity=".5"/>
    </svg>
    Glowie's Scripts
  </a>
  <div class="nav-links">
    <a href="https://discord.gg/mnCmzYQFwu" target="_blank">Discord</a>
    <div class="sep"></div>
    <a href="https://github.com/1dpcc" target="_blank">GitHub</a>

  </div>
</nav>

<header class="hero">
  <div class="eyebrow"><span class="eyebrow-line"></span>free roblox scripts<span class="eyebrow-line"></span></div>
  <h1><span class="h1-grad">Glowies Scripts</span></h1>
  <div class="badges">
    <div class="badge"><span class="dot dg"></span>All online</div>
    <div class="badge"><span class="dot dp"></span>Undetected</div>
  </div>
</header>

<div class="section-bar">
  <span>scripts</span><hr/><span id="scripts-count">0 total</span>
</div>

<main class="grid" id="scripts-grid"></main>

<footer>
  <div class="footer-brand">Glowie's Scripts</div>
  <div class="footer-links">
    <a href="https://discord.gg/" target="_blank">Discord ↗</a>
    <a href="https://github.com/" target="_blank">GitHub ↗</a>
  </div>
  <div class="footer-copy">© 2025 Glowie's Scripts. Free forever.</div>
</footer>

<div id="cl-modal" class="cl-modal" onclick="if(event.target===this)closeCL()">
  <div class="cl-box">
    <div class="cl-box-head">
      <span class="cl-box-title" id="cl-title"></span>
      <button class="cl-close" onclick="closeCL()">✕</button>
    </div>
    <div id="cl-content"></div>
  </div>
</div>

<script>
// Load scripts from JSON
async function loadScripts(){
  // If opened via file://, use embedded JSON (for local double-click testing)
  try{
    if (location.protocol === 'file:'){
      const embedded = document.getElementById('embedded-scripts');
      if (embedded){
        const data = JSON.parse(embedded.textContent || embedded.innerText || '{}');
        const scripts = Array.isArray(data.scripts) ? data.scripts : (Array.isArray(data) ? data : []);
        renderScripts(scripts);
        console.log('Loaded scripts from embedded JSON');
        return;
      }else{
        throw new Error('No embedded scripts.json present');
      }
    }

    const fetchUrl = new URL('./scripts.json', location.href).href;
    const res = await fetch(fetchUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const scripts = Array.isArray(data.scripts) ? data.scripts : (Array.isArray(data) ? data : []);
    renderScripts(scripts);
    console.log('Loaded scripts from', fetchUrl);
  }catch(e){
      const fetchUrl = (typeof fetchUrl !== 'undefined') ? fetchUrl : '';
      console.error('Failed to load scripts:', e, 'request:', fetchUrl);
      const grid = document.getElementById('scripts-grid');
      if (grid) {
        grid.innerHTML = `<div class="card"><div class="card-body"><div class="card-name">No scripts loaded</div><div class="card-desc">Unable to fetch <strong>scripts.json</strong>${fetchUrl?` from <code>${fetchUrl}</code>`:''}.<br/>Error: ${String(e.message || e)}</div></div></div>`;
      }
      const countEl = document.getElementById('scripts-count');
      if (countEl) countEl.textContent = '0 total';
  }
}

function renderScripts(scripts){
  const grid=document.getElementById('scripts-grid');
  if (!Array.isArray(scripts) || scripts.length === 0){
    grid.innerHTML = `<div class="card"><div class="card-body"><div class="card-name">No scripts available</div><div class="card-desc">The scripts file is empty or malformed.</div></div></div>`;
    const countEl = document.getElementById('scripts-count');
    if (countEl) countEl.textContent = '0 total';
    return;
  }
  grid.innerHTML=scripts.map(script=>`
    <div class="card" data-script-id="${script.id}">
      <div class="card-body">
        <div class="card-head">
          <div class="card-name">${script.name}</div>
          <span class="tag ${script.tag==='universal'?'tag-uni':'tag-game'}">${script.tagDisplay}</span>
        </div>
        <div class="card-desc">${script.description}</div>
        <div class="code-box">
          <div class="code-box-bar">
            <span class="code-lbl">lua</span>
            <button class="copy-btn" onclick="cp(this)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/></svg>
              copy
            </button>
          </div>
          <pre>${script.code}</pre>
        </div>
        <button class="cl-btn" onclick="openCL(this)">changelog</button>
        <div class="cl-data" hidden>${script.changelog.map(entry=>`
          <div class="cl-entry"><div class="cl-entry-head"><span class="cl-ver">${entry.version}</span><span class="cl-date">${entry.date}</span></div><p>${entry.notes}</p></div>
        `).join('')}</div>
      </div>
    </div>
  `).join('');
    const countEl = document.getElementById('scripts-count');
    if (countEl) countEl.textContent = `${scripts.length} total`;
}

function openCL(btn){
  const card=btn.closest('.card');
  document.getElementById('cl-title').textContent=card.querySelector('.card-name').textContent+' — Changelog';
  document.getElementById('cl-content').innerHTML=card.querySelector('.cl-data').innerHTML;
  document.getElementById('cl-modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCL(){
  document.getElementById('cl-modal').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCL()});

function cp(btn){
  const txt=btn.closest('.card').querySelector('pre').innerText;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.classList.add('ok');
    btn.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2 8 6 12 14 4"/></svg> copied!';
    setTimeout(()=>{
      btn.classList.remove('ok');
      btn.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/></svg> copy';
    },2000);
  });
}

// Load scripts on page load
loadScripts();

/* ── BACKGROUND: drifting particle-web + slow orbs ── */
(function(){
  const cv=document.getElementById('bg');
  const ctx=cv.getContext('2d');
  let W,H;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
  resize();
  window.addEventListener('resize',resize);

  const orbs=[
    {x:.15,y:.25,r:.38,h:270,s:.7},
    {x:.82,y:.6, r:.32,h:200,s:.55},
    {x:.5, y:.85,r:.28,h:240,s:.65},
    {x:.65,y:.15,r:.22,h:185,s:.5},
  ];

  const N=90;
  const pts=Array.from({length:N},()=>({
    x:Math.random(),y:Math.random(),
    vx:(Math.random()-.5)*.0003,
    vy:(Math.random()-.5)*.0003,
    r:Math.random()*1.2+.3,
  }));

  let t=0;
  function frame(){
    t+=.004;
    ctx.clearRect(0,0,W,H);

    orbs.forEach(o=>{
      const ox=o.x+Math.sin(t*o.s)*0.08;
      const oy=o.y+Math.cos(t*o.s*1.3)*0.06;
      const gr=ctx.createRadialGradient(ox*W,oy*H,0,ox*W,oy*H,o.r*Math.max(W,H)*.55);
      gr.addColorStop(0,`hsla(${o.h},80%,55%,0.07)`);
      gr.addColorStop(.5,`hsla(${o.h},70%,40%,0.03)`);
      gr.addColorStop(1,'transparent');
      ctx.fillStyle=gr;
      ctx.fillRect(0,0,W,H);
    });

    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=1;if(p.x>1)p.x=0;
      if(p.y<0)p.y=1;if(p.y>1)p.y=0;
    });

    const DIST=.14;
    ctx.lineWidth=.5;
    for(let i=0;i<N;i++){
      const a=pts[i];
      for(let j=i+1;j<N;j++){
        const b=pts[j];
        const dx=a.x-b.x,dy=a.y-b.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){
          const alpha=(1-d/DIST)*0.18;
          ctx.strokeStyle=`rgba(180,126,255,${alpha})`;
          ctx.beginPath();
          ctx.moveTo(a.x*W,a.y*H);
          ctx.lineTo(b.x*W,b.y*H);
          ctx.stroke();
        }
      }
    }

    pts.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(180,126,255,0.35)';
      ctx.fill();
    });

    ctx.strokeStyle='rgba(180,126,255,0.025)';
    ctx.lineWidth=.5;
    const gx=80;
    for(let x=0;x<W;x+=gx){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=0;y<H;y+=gx){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }

    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
